name: Relatar erro
description: Informe uma falha reproduzível no SSHPlus Manager
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Não publique senhas, tokens, chaves privadas ou o conteúdo de `server.key`.
  - type: input
    id: version
    attributes:
      label: Versão do SSHPlus Manager
      description: Saída de `sudo sshplus --version`
      placeholder: 4.5.0
    validations:
      required: true
  - type: input
    id: ubuntu
    attributes:
      label: Versão do Ubuntu
      placeholder: Ubuntu 24.04/26.04 LTS
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Módulo afetado
      options:
        - Instalação ou atualização
        - Usuários SSH
        - OpenSSH
        - OpenVPN
        - BadVPN
        - SlowDNS / DNSTT
        - Backup e restauração
        - Serviços systemd
        - Outro
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: O que aconteceu?
      description: Descreva o resultado obtido e o resultado esperado.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Como reproduzir?
      description: Informe os passos mínimos, removendo dados sensíveis.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs sanitizados
      description: Cole somente trechos relevantes, sem credenciais ou chaves.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Verificações
      options:
        - label: Confirmei que não há dados sensíveis neste relato.
          required: true
        - label: Executei `sudo ./verify.sh` ou expliquei por que não foi possível.
          required: true
