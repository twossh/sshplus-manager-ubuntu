name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Validar e publicar release
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Obter código e tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar ferramentas de validação
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck zip sqlite3 php-cli sudo nginx openssl jq curl

      - name: Normalizar permissões dos scripts
        run: chmod +x install-online.sh install.sh uninstall.sh verify.sh scripts/*.sh bin/*

      - name: Definir versão e tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Versão inválida: $version" >&2
            exit 1
          }
          tag="v$version"
          if [[ "${GITHUB_REF_TYPE:-}" == tag && "${GITHUB_REF_NAME:-}" != "$tag" ]]; then
            echo "Tag ${GITHUB_REF_NAME} não corresponde a $tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Validar e gerar artefatos
        env:
          SSHPLUS_RUN_PANEL_INTEGRATION: "1"
        run: bash ./scripts/ci.sh

      - name: Publicar ou atualizar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist -maxdepth 1 -type f \
            \( -name '*.zip' -o -name '*.tar.gz' -o -name 'SHA256SUMS-release.txt' \) \
            -print | LC_ALL=C sort)
          (( ${#assets[@]} > 0 )) || {
            echo 'Nenhum artefato de Release foi gerado.' >&2
            exit 1
          }

          existing_tag_sha="$(git rev-list -n1 "$RELEASE_TAG" 2>/dev/null || true)"
          if [[ -n "$existing_tag_sha" && "$existing_tag_sha" != "$GITHUB_SHA" ]]; then
            echo "A tag $RELEASE_TAG já aponta para $existing_tag_sha, não para $GITHUB_SHA." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            echo "Release $RELEASE_TAG atualizada com artefatos validados."
          elif [[ -n "$existing_tag_sha" ]]; then
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "SSHPlus Manager $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "SSHPlus Manager $RELEASE_TAG"
          fi

          gh release view "$RELEASE_TAG" --json url,tagName,name \
            --jq '"Release publicada: " + .name + " — " + .url' >> "$GITHUB_STEP_SUMMARY"
