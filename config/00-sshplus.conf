# SSHPlus Manager 5.0 - configuração modular para OpenSSH.
# O prefixo 00 garante precedência no Ubuntu, sem editar sshd_config.
PasswordAuthentication yes
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PubkeyAuthentication yes
UsePAM yes
UseDNS no
Compression delayed
TCPKeepAlive yes
AllowTcpForwarding yes
AllowAgentForwarding no
GatewayPorts no
PermitTunnel yes
PermitUserEnvironment no
X11Forwarding no
ClientAliveInterval 120
ClientAliveCountMax 2
LoginGraceTime 45
MaxAuthTries 4
MaxSessions 100
MaxStartups 100:30:500
